<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Microscope</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #10151b;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 25px 15px;
    text-align: center;
    background: #19232e;
}

header h1 {
    margin: 0;
    color: #70c7ff;
}

header p {
    color: #aab7c4;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

select, button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    margin: 5px;
    background: #263747;
    color: white;
    font-size: 15px;
}

.viewer {
    width: 100%;
    height: 450px;
    overflow: hidden;
    background: black;
    border: 2px solid #34495e;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
}

.viewer img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transform-origin: center;
    user-select: none;
    pointer-events: none;
}

.controls {
    text-align: center;
    margin: 15px 0;
}

.info {
    background: #19232e;
    padding: 18px;
    border-radius: 10px;
    margin-top: 15px;
}

.info h2 {
    color: #70c7ff;
}

footer {
    text-align: center;
    padding: 20px;
    color: #778899;
}
</style>
</head>

<body>

<header>
<h1>🔬 VIRTUAL MICROSCOPE</h1>
<p>Digital Biology Laboratory</p>
</header>

<div class="container">

<h3>Выберите микропрепарат:</h3>

<select id="photo" onchange="changePhoto()">
<option value="IMG_2830.jpeg">Микропрепарат 1</option>
<option value="IMG_2831.jpeg">Микропрепарат 2</option>
<option value="IMG_2832.jpeg">Микропрепарат 3</option>
</select>

<div class="viewer" id="viewer">
<img id="micro" src="IMG_2830.jpeg" alt="Микропрепарат">
</div>

<div class="controls">
<button onclick="zoomIn()">＋ Увеличить</button>
<button onclick="zoomOut()">－ Уменьшить</button>
<button onclick="resetZoom()">⟲ Сбросить</button>
</div>

<div class="info">
<h2>Микроскопическое исследование</h2>
<p>Цифровая коллекция микропрепаратов.</p>
<p>Используйте увеличение для изучения структуры объекта.</p>
<p id="scale">Масштаб: 100%</p>
</div>

</div>

<footer>
Virtual Microscope | Biology Laboratory
</footer>

<script>
let scale = 1;
let x = 0;
let y = 0;

const img = document.getElementById("micro");
const viewer = document.getElementById("viewer");

function update() {
    img.style.transform =
        `translate(${x}px, ${y}px) scale(${scale})`;

    document.getElementById("scale").textContent =
        "Масштаб: " + Math.round(scale * 100) + "%";
}

function zoomIn() {
    scale = Math.min(scale + 0.25, 8);
    update();
}

function zoomOut() {
    scale = Math.max(scale - 0.25, 1);
    update();
}

function resetZoom() {
    scale = 1;
    x = 0;
    y = 0;
    update();
}

function changePhoto() {
    img.src = document.getElementById("photo").value;
    resetZoom();
}

let startX = 0;
let startY = 0;
let dragging = false;

viewer.addEventListener("pointerdown", e => {
    dragging = true;
    startX = e.clientX - x;
    startY = e.clientY - y;
    viewer.setPointerCapture(e.pointerId);
});

viewer.addEventListener("pointermove", e => {
    if (!dragging) return;

    x = e.clientX - startX;
    y = e.clientY - startY;
    update();
});

viewer.addEventListener("pointerup", () => {
    dragging = false;
});

viewer.addEventListener("pointercancel", () => {
    dragging = false;
});
</script>

</body>
</html>
